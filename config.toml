# The base URL of the site
base_url = "https://vitenhub.no"

# The site title and description
title = "Viten Hub"
description = "Reproducible and replicable research — we make your research re-runnable by anyone, and test whether published results hold on your data. Citable results on the open Science Live platform."

# The default language
default_language = "en"

# Generate a feed
generate_feed = false

# Compile Sass
compile_sass = false

# Minify HTML
minify_html = true

# Build search index
build_search_index = false

[markdown]
# Enable syntax highlighting
highlight_code = false

[extra]
# Add any extra variables you want to use in templates
company_name = "Viten Hub"
tagline = "Know the research holds — before you rely on it"
email = "contact@vitenhub.no"
