# The base URL of the site
base_url = "https://vitenhub.no"

# The site title and description
title = "Viten Hub"
description = "We check published research before you rely on it: we re-run it, test it on your data, and give you a clear answer with its limits. Fixed price."

# The default language
default_language = "en"

# Generate a feed
generate_feed = false

# Compile Sass
compile_sass = false

# Minify HTML
minify_html = true

# Build search index
build_search_index = false

[markdown]
# Enable syntax highlighting
highlight_code = false

[extra]
# Add any extra variables you want to use in templates
company_name = "Viten Hub"
email = "contact@vitenhub.no"

